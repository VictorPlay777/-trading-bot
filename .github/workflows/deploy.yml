name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create deployment archive
        run: |
          tar -czf deploy.tar.gz \
            --exclude='.git' \
            --exclude='venv' \
            --exclude='.venv*' \
            --exclude='logs' \
            --exclude='.env' \
            --exclude='*.log' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='*.bundle' \
            .

      - name: Upload and deploy to server
        run: |
          set -e
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key

          PORT="${SERVER_PORT:-22}"

          # Upload archive
          scp -i ~/.ssh/deploy_key \
              -P "$PORT" \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              deploy.tar.gz "$SERVER_USER@$SERVER_HOST:/tmp/deploy.tar.gz"

          # Extract, install deps and restart bot
          ssh -i ~/.ssh/deploy_key \
              -p "$PORT" \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              "$SERVER_USER@$SERVER_HOST" <<'EOF'
            set -e
            DEPLOY_DIR="/home/svy1990/-trading-bot"
            cd "$DEPLOY_DIR"

            # Extract new sources over the live directory, preserving runtime data.
            tar -xzf /tmp/deploy.tar.gz \
              --exclude='venv' \
              --exclude='.venv*' \
              --exclude='logs' \
              --exclude='.env' \
              --exclude='*.log' \
              --exclude='__pycache__' \
              --exclude='*.pyc' \
              --exclude='*.bundle'

            . venv/bin/activate
            pip install -q -r requirements.txt

            # Stop previous bot/supervisor if running.
            pkill -f run_selective_ml_forever || true
            pkill -f selective_ml_bot.py || true
            sleep 2

            # Start the v7 selective ML bot with the auto-restart supervisor.
            chmod +x run_selective_ml_forever.sh
            nohup bash run_selective_ml_forever.sh >> selective_ml_supervisor.log 2>&1 &
            sleep 3

            echo "Deployment complete!"
            ps aux | grep -E "selective_ml_bot|run_selective_ml_forever" | grep -v grep || true
            tail -n 20 selective_ml_supervisor.log || true
EOF
