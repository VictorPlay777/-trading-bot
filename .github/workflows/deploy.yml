name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/-trading-bot

            # Ensure a public HTTPS remote so a stale token cannot break pulls.
            git remote get-url origin >/dev/null 2>&1 || \
              git remote add origin https://github.com/VictorPlay777/-trading-bot.git
            git remote set-url origin https://github.com/VictorPlay777/-trading-bot.git
            git fetch origin
            git reset --hard origin/main
            git clean -fd -e venv -e logs -e "bot_*.log" -e symbol_stats.json -e learning_history.json -e leverage_cache.json -e .env || true

            . venv/bin/activate
            pip install -q -r requirements.txt

            # Stop previous bot/supervisor if running.
            pkill -f run_selective_ml_forever || true
            pkill -f selective_ml_bot.py || true
            sleep 2

            # Start the v7 selective ML bot with the auto-restart supervisor.
            chmod +x run_selective_ml_forever.sh
            nohup bash run_selective_ml_forever.sh >> selective_ml_supervisor.log 2>&1 &
            sleep 3

            echo "Deployment complete!"
            ps aux | grep -E "selective_ml_bot|run_selective_ml_forever" | grep -v grep || true
            tail -n 20 selective_ml_supervisor.log || true
