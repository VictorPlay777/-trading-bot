name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -e
            DEPLOY_DIR="/home/svy1990/-trading-bot"
            TMP_DIR="/tmp/trading-bot-deploy"
            ARCHIVE="/tmp/trading-bot-main.tar.gz"

            rm -rf "$TMP_DIR" "$ARCHIVE"
            mkdir -p "$TMP_DIR"

            # Download latest main source archive (public repo, no git auth needed).
            curl -fsSL -o "$ARCHIVE" "https://github.com/VictorPlay777/-trading-bot/archive/main.tar.gz"
            tar -xzf "$ARCHIVE" -C "$TMP_DIR" --strip-components=1

            # Sync sources over the live bot directory, preserving runtime data.
            cd "$TMP_DIR"
            tar -cf - \
              --exclude='.git' \
              --exclude='venv' \
              --exclude='.venv*' \
              --exclude='logs' \
              --exclude='.env' \
              --exclude='*.log' \
              --exclude='*.pyc' \
              --exclude='__pycache__' \
              . | tar -xf - -C "$DEPLOY_DIR"

            cd "$DEPLOY_DIR"

            . venv/bin/activate
            pip install -q -r requirements.txt

            # Stop previous bot/supervisor if running.
            pkill -f run_selective_ml_forever || true
            pkill -f selective_ml_bot.py || true
            sleep 2

            # Start the v7 selective ML bot with the auto-restart supervisor.
            chmod +x run_selective_ml_forever.sh
            nohup bash run_selective_ml_forever.sh >> selective_ml_supervisor.log 2>&1 &
            sleep 3

            echo "Deployment complete!"
            ps aux | grep -E "selective_ml_bot|run_selective_ml_forever" | grep -v grep || true
            tail -n 20 selective_ml_supervisor.log || true
